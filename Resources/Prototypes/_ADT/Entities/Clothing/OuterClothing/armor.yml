- type: entity
  abstract: true
  id: BadgeOnClothing
  components:
  - type: Badgeable
  - type: ContainerContainer
    containers:
      badge: !type:ContainerSlot
        showEnts: False
        occludes: True
        ent: null
  - type: ItemSlots
    slots:
      badge:
        name: Badge
        insertVerbText: attach-to-armor
        ejectVerbText: unattach-to-armor
        whitelist:
          tags:
          - ADTBadge
  - type: ItemMapper
    sprite: _ADT/Clothing/OuterClothing/Armor/armor_overlay.rsi
    mapLayers:
      badgebronze:
        whitelist:
          tags:
          - ADTBadgeBronze
      badgesilver:
        whitelist:
          tags:
          - ADTBadgeSilver
      badgegolden:
        whitelist:
          tags:
          - ADTBadgeGolden
  - type: Appearance

- type: entity
  abstract: true
  id: BadgeOnClothingWithContainer
  components:
  - type: Badgeable
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        showEnts: False
        occludes: True
        ents: []
      badge: !type:ContainerSlot
        showEnts: False
        occludes: True
        ent: null
  - type: ItemSlots
    slots:
      badge:
        name: Badge
        insertVerbText: attach-to-armor
        ejectVerbText: unattach-to-armor
        whitelist:
          tags:
          - ADTBadge
  - type: ItemMapper
    sprite: _ADT/Clothing/OuterClothing/Armor/armor_overlay.rsi
    mapLayers:
      badgebronze:
        whitelist:
          tags:
          - ADTBadgeBronze
      badgesilver:
        whitelist:
          tags:
          - ADTBadgeSilver
      badgegolden:
        whitelist:
          tags:
          - ADTBadgeGolden
  - type: Appearance
