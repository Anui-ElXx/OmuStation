# Timers
- type: loadoutEffectGroup
  id: HeadofSecuritySilverBadgeTimer
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:DepartmentTimeRequirement
      department: Security
      time: 360000 # 100 hrs
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobHeadOfSecurity
      time: 72000 # 20 hrs

- type: loadoutEffectGroup
  id: HeadofSecurityGoldBadgeTimer
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:DepartmentTimeRequirement
      department: Security
      time: 1080000 # 300 hrs
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobHeadOfSecurity
      time: 216000 # 60 hrs


# Loadouts
- type: loadout
  id: HeadofSecurityCloakLong
  equipment:
    neck: ClothingNeckLongCloakHOS
  effects:
  - !type:GroupLoadoutEffect
    proto: MasterHoS

- type: loadout
  id: HeadofSecurityBronzeBadge
  equipment:
    neck: ClothingNeckSecBadgeHosBronze

- type: loadout
  id: HeadofSecuritySilverBadge
  equipment:
    neck: ClothingNeckSecBadgeHosSilver
  effects:
  - !type:GroupLoadoutEffect
    proto: HeadofSecuritySilverBadgeTimer
